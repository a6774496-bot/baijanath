<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | श्री बैजनाथ मा.वि.</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a365d;
            --secondary: #0d9488;
            --accent: #d97706;
            --danger: #dc2626;
            --bg-light: #f1f5f9;
            --text-dark: #1e293b;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: var(--primary);
            color: var(--white);
            padding: 20px 0;
            position: fixed;
            height: 100%;
        }

        .sidebar-brand {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .sidebar-menu {
            list-style: none;
            margin-top: 20px;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 25px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background: var(--secondary);
            color: var(--white);
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
            width: calc(100% - 250px);
        }

        .header-title {
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--secondary);
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--white);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .card-header {
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .btn-submit {
            background: var(--secondary);
            color: var(--white);
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }

        .alert-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: none;
        }

        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-error { background: #fee2e2; color: #991b1b; }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; width: 100%; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            <h2><i class="fas fa-user-shield"></i> Admin Panel</h2>
            <p style="font-size:0.75rem; color:#94a3b8; margin-top:4px;">श्री बैजनाथ मा.वि.</p>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#ticker-sec" class="active"><i class="fas fa-bullhorn"></i> Ticker Control</a></li>
            <li><a href="#notice-sec"><i class="fas fa-newspaper"></i> Add Notice</a></li>
            <li><a href="#result-sec"><i class="fas fa-file-invoice"></i> Add Result</a></li>
            <li><a href="#teacher-sec"><i class="fas fa-user-plus"></i> Add Teacher</a></li>
            <li><a href="index.html" target="_blank"><i class="fas fa-globe"></i> View Website</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-title">
            <h1>प्रणाली व्यवस्थापन (Control Panel)</h1>
            <span style="font-size:0.85rem; color:#64748b;">Google Sheets Connected</span>
        </div>

        <div class="admin-grid">

            <!-- 1. Ticker Message Control Card -->
            <div class="card" id="ticker-sec">
                <div class="card-header"><i class="fas fa-bullhorn"></i> Ticker Text अपडेट गर्नुहोस्</div>
                <form id="tickerForm">
                    <div class="form-group">
                        <label>नयाँ सूचना / Notice Message:</label>
                        <textarea id="tickerInput" placeholder="उदा: नयाँ शैक्षिक सत्र २०८३ को लागि भर्ना खुल्यो!" required></textarea>
                    </div>
                    <button type="submit" id="btnTicker" class="btn-submit">Ticker फेर्नुहोस्</button>
                </form>
                <div id="msgTicker" class="alert-box alert-success"></div>
            </div>

            <!-- 2. Notice Publishing Form Card -->
            <div class="card" id="notice-sec">
                <div class="card-header"><i class="fas fa-plus-circle"></i> नयाँ सूचना प्रकाशित गर्नुहोस्</div>
                <form id="noticeForm">
                    <div style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex: 1;">
                            <label>Month:</label>
                            <input type="text" id="nMonth" placeholder="AUG" required>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Day:</label>
                            <input type="text" id="nDay" placeholder="28" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>शीर्षक:</label>
                        <input type="text" id="nTitle" placeholder="भर्ना आवेदन सम्बन्धी सूचना" required>
                    </div>
                    <div class="form-group">
                        <label>विवरण:</label>
                        <textarea id="nContent" placeholder="सूचनाको विस्तृत विवरण..." required></textarea>
                    </div>
                    <button type="submit" id="btnNotice" class="btn-submit">सूचना सेभ गर्नुहोस्</button>
                </form>
                <div id="msgNotice" class="alert-box alert-success"></div>
            </div>

            <!-- 3. Result Form Card -->
            <div class="card" id="result-sec">
                <div class="card-header"><i class="fas fa-poll-h"></i> नतिजा प्रविष्टि (Add Result)</div>
                <form id="resultForm">
                    <div style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex: 1;">
                            <label>Symbol No:</label>
                            <input type="text" id="rSymbol" placeholder="1001" required>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Class:</label>
                            <select id="rClass" required>
                                <option value="11">Class 11</option>
                                <option value="12">Class 12</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>विद्यार्थीको नाम:</label>
                        <input type="text" id="rName" placeholder="Ayush Pant" required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group"><label>English:</label><input type="text" id="rEng" placeholder="A+" required></div>
                        <div class="form-group"><label>Math:</label><input type="text" id="rMath" placeholder="A" required></div>
                        <div class="form-group"><label>Science:</label><input type="text" id="rSci" placeholder="B+" required></div>
                        <div class="form-group"><label>Nepali:</label><input type="text" id="rNep" placeholder="A" required></div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex: 1;"><label>GPA:</label><input type="text" id="rGpa" placeholder="3.6" required></div>
                        <div class="form-group" style="flex: 1;"><label>Status:</label><input type="text" id="rStatus" placeholder="Passed" required></div>
                    </div>
                    <button type="submit" id="btnResult" class="btn-submit">नतिजा सेभ गर्नुहोस्</button>
                </form>
                <div id="msgResult" class="alert-box alert-success"></div>
            </div>

            <!-- 4. Teacher Profile Card -->
            <div class="card" id="teacher-sec">
                <div class="card-header"><i class="fas fa-user-tie"></i> नयाँ शिक्षक थप्नुहोस्</div>
                <form id="teacherForm">
                    <div class="form-group">
                        <label>शिक्षकको नाम:</label>
                        <input type="text" id="tName" placeholder="Nav Raj Pant" required>
                    </div>
                    <div class="form-group">
                        <label>पद:</label>
                        <input type="text" id="tDesig" placeholder="Principal" required>
                    </div>
                    <div class="form-group">
                        <label>फोटो लिङ्क (Photo URL):</label>
                        <input type="url" id="tPhoto" placeholder="https://i.ibb.co/..." required>
                    </div>
                    <button type="submit" id="btnTeacher" class="btn-submit">शिक्षक थप्नुहोस्</button>
                </form>
                <div id="msgTeacher" class="alert-box alert-success"></div>
            </div>

        </div>
    </div>

    <script>
        // 🚀 नयाँ Google Apps Script Web App URL
        const webAppUrl = "https://script.google.com/macros/s/AKfycbyCvN8g4ArR9y3EeNmB4-qLQGmUu5vKgqjq4CDHP0B70bXUoYpY30INeE3j3Y1vhxJ8kg/exec";

        function showMsg(id, text, isSuccess = true) {
            const el = document.getElementById(id);
            el.style.display = 'block';
            el.className = `alert-box ${isSuccess ? 'alert-success' : 'alert-error'}`;
            el.innerHTML = isSuccess ? `✔ ${text}` : `✖ ${text}`;
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        async function postData(payload, btnId, msgId, formId, successText) {
            const btn = document.getElementById(btnId);
            btn.disabled = true;
            btn.innerText = "सेभ हुँदैछ...";

            try {
                await fetch(webAppUrl, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                showMsg(msgId, successText);
                document.getElementById(formId).reset();
            } catch (err) {
                showMsg(msgId, "त्रुटि भयो! डाटा सेभ भएन।", false);
            } finally {
                btn.disabled = false;
                btn.innerText = "सेभ गर्नुहोस्";
            }
        }

        document.getElementById('tickerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            postData({ action: "updateTicker", ticker: document.getElementById('tickerInput').value }, 'btnTicker', 'msgTicker', 'tickerForm', 'Ticker Text सेभ भयो!');
        });

        document.getElementById('noticeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            postData({
                action: "addNotice",
                month: document.getElementById('nMonth').value,
                day: document.getElementById('nDay').value,
                title: document.getElementById('nTitle').value,
                content: document.getElementById('nContent').value
            }, 'btnNotice', 'msgNotice', 'noticeForm', 'सूचना सफलतापुर्वक थपियो!');
        });

        document.getElementById('resultForm').addEventListener('submit', (e) => {
            e.preventDefault();
            postData({
                action: "addResult",
                symbol: document.getElementById('rSymbol').value,
                sClass: document.getElementById('rClass').value,
                studentName: document.getElementById('rName').value,
                english: document.getElementById('rEng').value,
                math: document.getElementById('rMath').value,
                science: document.getElementById('rSci').value,
                nepali: document.getElementById('rNep').value,
                gpa: document.getElementById('rGpa').value,
                result: document.getElementById('rStatus').value
            }, 'btnResult', 'msgResult', 'resultForm', 'नतिजा सफलतापुर्वक अपलोड भयो!');
        });

        document.getElementById('teacherForm').addEventListener('submit', (e) => {
            e.preventDefault();
            postData({
                action: "addTeacher",
                name: document.getElementById('tName').value,
                designation: document.getElementById('tDesig').value,
                photoUrl: document.getElementById('tPhoto').value
            }, 'btnTeacher', 'msgTeacher', 'teacherForm', 'शिक्षक प्रोफाइल थपियो!');
        });
    </script>
</body>
</html>
